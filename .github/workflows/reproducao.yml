# Reconstrói o ambiente do zero a partir do renv.lock, numa máquina limpa, e
# roda o que o auditor rodaria: testes, pipeline e renderização dos
# documentos. Tudo sobre os dados sintéticos; nenhum segredo é usado.
name: reproducao

on:
  push:
    branches: [main, "wave-*"]
  pull_request:
  workflow_dispatch:

jobs:
  reproduzir:
    runs-on: ubuntu-24.04
    # As 100 realizações da wave 3 refazem a escolha de hiperparâmetros em
    # cada uma e levam cerca de quatro horas. No push e no pull request roda
    # uma corrida reduzida, de 5 realizações; a completa só por disparo manual.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 120 }}
    env:
      W3_REALIZACOES: ${{ github.event_name == 'workflow_dispatch' && '100' || '5' }}
      # Na corrida reduzida, a trava de diretorio_de_saida() desvia tabelas e
      # figuras para cá, e outputs/ fica intocada.
      W3_SAIDA_REDUZIDA: ${{ github.workspace }}/../saida_reduzida

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      # Bibliotecas de sistema para os pacotes que o renv precisar compilar
      # quando a versão fixada não tiver binário pronto.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libgmp3-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev libicu-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Estado do renv
        run: Rscript -e 'renv::status()'

      # A pipeline vem antes dos testes porque parte deles lê o store do
      # targets, que numa máquina limpa só existe depois do tar_make().
      - name: Pipeline
        run: Rscript -e 'targets::tar_make()'

      - name: Testes
        run: Rscript tests/testthat.R

      - name: Renderização dos documentos
        run: Rscript -e 'source("outputs/results/eda/_renderizar.R")'

      - name: Renderização dos documentos da modelagem
        run: Rscript -e 'source("outputs/results/scoring/_renderizar.R")'

      - name: Renderização dos documentos da otimização
        run: Rscript -e 'source("outputs/results/optim/_renderizar.R")'

      # Os dados e tabelas regenerados devem bater com os versionados. Diferença
      # aqui não derruba o job, porque a última casa decimal de ponto flutuante
      # pode variar entre sistemas operacionais; o relatório fica no log.
      - name: Dados regenerados contra os versionados
        continue-on-error: true
        run: |
          git diff --stat --exit-code -- data/synthetic outputs/tables
          # Na corrida reduzida, as tabelas fora da wave 3 saem iguais às
          # versionadas; as da wave 3 dependem do número de realizações.
          if [ "$W3_REALIZACOES" != "100" ]; then
            for arquivo in "$W3_SAIDA_REDUZIDA"/tables/*.csv; do
              nome=$(basename "$arquivo")
              case "$nome" in w3_*|achados_w3*) continue ;; esac
              diff -q "$arquivo" "outputs/tables/$nome" || status=1
            done
            exit ${status:-0}
          fi
