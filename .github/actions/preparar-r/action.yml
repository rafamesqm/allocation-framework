# Prepara a máquina limpa: pandoc, R fixado, bibliotecas de sistema e os
# pacotes do renv.lock. Compartilhada pelos jobs do workflow de reprodução.
name: preparar-r
description: Instala o R, as dependências de sistema e restaura o renv.lock.

runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.5.3"
        use-public-rspm: true

    # Bibliotecas de sistema para os pacotes que o renv precisar compilar
    # quando a versão fixada não tiver binário pronto.
    - name: Dependências de sistema
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev libgmp3-dev \
          libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
          libpng-dev libtiff5-dev libjpeg-dev libicu-dev

    # O OpenBLAS do runner escolhe o kernel pela CPU e pode mudar a última casa
    # de um produto escalar conforme a posição da linha. O BLAS de referência
    # é o mesmo que o R usa no Windows, onde os versionados foram gerados.
    - name: BLAS de referência
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends libblas3 liblapack3
        sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
        sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3
        Rscript -e 'si <- sessionInfo(); cat("BLAS:", si$BLAS, "\nLAPACK:", si$LAPACK, "\n")'

    - uses: r-lib/actions/setup-renv@v2

    - name: Estado do renv
      shell: bash
      run: Rscript -e 'renv::status()'
